services:
  deepfake-cinema:
    build:
      context: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./input:/app/input
      - ./models:/app/models:ro
      - ./output:/app/output
      - ./.runcrate-bridge-token:/runcrate-bridge/token:ro
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "3000"
      RUNCRATE_BRIDGE_URL: "http://host.docker.internal:38765"
      RUNCRATE_BRIDGE_TOKEN_PATH: "/runcrate-bridge/token"
      RUNCRATE_INSTANCE: "${RUNCRATE_INSTANCE:-face-swap}"
    init: true
